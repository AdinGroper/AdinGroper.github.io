    <style>
        /* ── Dark section ────────────────────────────────────────── */
        .dark-section { padding: 4.5em 2em 4em; }
        .heading-dark {
            position: relative;
            z-index: 1;
            margin: 0 0 1.75em;
            font-family: 'Raleway', sans-serif;
            font-weight: 300;
            font-size: 1.6rem;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: #e8f4ee;
            text-shadow:
                0 0 30px rgba(140, 210, 170, 0.35),
                0 0 70px rgba(100, 170, 130, 0.15);
        }
        #chartdiv { position: relative; z-index: 1; }

        /* ── Light section ───────────────────────────────────────── */
        .light-section { padding: 3em 2em 4em; text-align: center; }
        .heading-light { margin-bottom: 2em; }

        @media (min-width: 1024px) {
            .destination-list { padding: 0 3em !important; }
            .heading-dark { font-size: 2.2rem; }
        }

        /* ── Globe tooltip ───────────────────────────────────────── */
        #globe-tooltip {
            position: fixed;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 4px 12px;
            border-radius: 4px;
            font-family: 'Oswald', Arial;
            font-size: 0.9rem;
            pointer-events: none;
            display: none;
            z-index: 100;
        }

        /* ── Responsive globe ────────────────────────────────────── */
        #chartdiv { height: unset !important; aspect-ratio: 1; }
        #chartdiv svg { display: block; width: 100%; height: 100%; overflow: visible; }
        @media (min-width: 1024px) {
            #chartdiv { width: min(60%, 500px) !important; margin-left: auto; margin-right: auto; }
        }

        /* ── Continent groups ────────────────────────────────────── */
        .continent-group { max-width: 900px; }
    </style>
</head>

        const projection = d3.geoOrthographic()
            .scale(radius)
            .translate([cx, cy])
            .clipAngle(90)
            .rotate([0, -20]);

        const pathGen = d3.geoPath().projection(projection);

        // Mutable globe state
        let rotX = 0;
        let rotY = -10; // default tilt
        let isIntro         = true;   // true while the region tour is running
        let isDragging      = false;
        let spinPausedUntil = 0;      // timestamp — spin waits until this passes
        let prevElapsed     = 0;
        let introActive               = true;     // globe starts fully dark; cleared when tour ends
        let globallyRevealedCountries = new Set(); // accumulates across all regions, never resets
        let zoomResetTimeout          = null;
        let zoomAnimCancelled         = false;
        let dragActive                = false;
        let hoveredCountryId          = null;
        let lastPinchDist             = null;

        // Touch/coarse-pointer devices (phones, tablets) don't get drag/pinch/tap
        // interaction — it fights with normal page scrolling more than it helps there.
        // The globe still displays and auto-rotates normally, just isn't interactive.
        const isMobile = window.matchMedia('(pointer: coarse)').matches;

        const inGlobe = (x, y) => (x - cx) ** 2 + (y - cy) ** 2 <= radius * radius;

        // Convert clientX/clientY (screen pixels) to SVG logical coordinates
        function toSVGCoords(clientX, clientY) {
            const rect = svg.node().getBoundingClientRect();
            return [
                (clientX - rect.left) * (LOGICAL / rect.width),
                (clientY - rect.top)  * (LOGICAL / rect.height),
            ];
        }

        // Reveal groups — countries lit up in this order during the intro, roughly geographic

            {
                name: 'North America',

                    484,  // Mexico            (southwest)
                    84,   // Belize            (Central America, west)

                    591,  // Panama            (southernmost)
                    136,  // Cayman Islands    (Caribbean, west)
                    44,   // Bahamas           (Caribbean, north)
                    214,  // Dominican Republic(Caribbean, center)
                    850,  // US Virgin Islands (Caribbean, east)
                    92,   // British Virgin Is.(Caribbean, east)

            },
            {
                name: 'South America',
                countries: new Set([
                    170,  // Colombia
                    32,   // Argentina
                    604,  // Peru
                ])
            },
            {
                name: 'Europe',
                countries: new Set([
                    372,  // Ireland     (far west, north)
                    620,  // Portugal    (far west, south)
                    724,  // Spain
                    20,   // Andorra     (between Spain & France)
                    250,  // France
                    442,  // Luxembourg
                    276,  // Germany
                    756,  // Switzerland
                    380,  // Italy
                    336,  // Vatican City (within Italy)
                    40,   // Austria
                    203,  // Czechia
                    348,  // Hungary     (east)
                    470,  // Malta       (far south)
                ])
            },
            {
                name: 'Africa',
                countries: new Set([504]) // Morocco
            },
            {
                name: 'Asia',
                countries: new Set([
                    376,  // Israel    (westernmost)
                    156,  // China
                    702,  // Singapore (south, ~same longitude as China)
                    392,  // Japan     (easternmost)
                ])
            },
            {
                name: 'Oceania',
                countries: new Set() // no visited countries yet
            }
        ];

        const svg = d3.select('#chartdiv')
            .append('svg')
            .attr('viewBox', `0 0 ${LOGICAL} ${LOGICAL}`)
            .attr('width', '100%')
            .attr('height', '100%')
            .style('cursor', 'default');

        const defs = svg.append('defs');

        defs.append('clipPath').attr('id', 'globe-clip')
            .append('circle').attr('cx', cx).attr('cy', cy).attr('r', radius);

        const shadow = defs.append('filter').attr('id', 'globe-shadow');
        shadow.append('feDropShadow')
            .attr('dx', 4).attr('dy', 6)
            .attr('stdDeviation', 8)
            .attr('flood-color', '#000')
            .attr('flood-opacity', 0.5);

        // Ocean
        svg.append('circle')
            .attr('cx', cx).attr('cy', cy).attr('r', radius)
            .attr('fill', '#152738')
            .attr('filter', 'url(#globe-shadow)');

        const mapGroup = svg.append('g').attr('clip-path', 'url(#globe-clip)');

        // Load world topology from CDN
        const world = await d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
        const countries = topojson.feature(world, world.objects.countries);
        const borders   = topojson.mesh(world, world.objects.countries, (a, b) => a !== b);

        const HOME = 840; // United States

        function countryFill(id) {
            if (id === HOME) return '#5ba8c8';
            if (introActive) {
                // Globe starts fully dark; countries light up only once revealed
                return globallyRevealedCountries.has(id) ? '#90ee60' : '#243b23';
            }
            return visited.has(id) ? '#4a9e3f' : '#243b23';
        }

        // Country fills
        mapGroup.selectAll('path.country')
            .data(countries.features)
            .enter()
            .append('path')
            .attr('class', 'country')
            .attr('d', pathGen)
            .attr('fill', d => countryFill(+d.id))
            .on('mouseover', function (event, d) {
                const id   = +d.id;
                hoveredCountryId = id;
                const name = countryNames[id];
                if (id === HOME)          d3.select(this).attr('fill', '#7ec8e3');
                else if (visited.has(id)) d3.select(this).attr('fill', '#6fcf58');
                if (name) {
                    tooltip.textContent = name;
                    tooltip.style.display = 'block';
                }
            })
            .on('mousemove', function (event) {
                tooltip.style.left = (event.clientX + 14) + 'px';
                tooltip.style.top  = (event.clientY - 30) + 'px';
            })
            .on('mouseout', function (event, d) {
                hoveredCountryId = null;
                d3.select(this).attr('fill', countryFill(+d.id));
                tooltip.style.display = 'none';
            })
            .on('touchstart', function (event, d) {
                if (isMobile) return;
                const id   = +d.id;
                const name = countryNames[id];
                if (!name) return;
                const touch = event.touches[0];
                tooltip.textContent = name;
                tooltip.style.left  = (touch.clientX + 14) + 'px';
                tooltip.style.top   = (touch.clientY - 30) + 'px';
                tooltip.style.display = 'block';
                setTimeout(() => { tooltip.style.display = 'none'; }, 2000);

            .attr('class', 'borders')

        const dots = mapGroup.selectAll('circle.small-dot')

            .attr('r', 5)

        function updateDots() {
            dots.each(function (d) {
                const pos      = projection(d.coords);
                const visible  = d3.geoDistance(d.coords, [-rotX, -rotY]) < Math.PI / 2;
                const revealed   = d.id !== null && globallyRevealedCountries.has(d.id);
                const isVisited  = d.id !== null && visited.has(d.id);

                // During intro: hide until revealed; after intro: visited only
                const show = introActive ? revealed : isVisited;

                if (pos && visible && show) {
                    d3.select(this)
                        .attr('cx', pos[0])
                        .attr('cy', pos[1])
                        .attr('r', 5)
                        .attr('fill', isVisited ? '#6fcf58' : '#4a7a4a')
                        .style('display', null);
                } else {
                    d3.select(this).style('display', 'none');
                }
            });
        }

            .attr('cx', cx).attr('cy', cy).attr('r', radius)
            .attr('fill', 'none')
            .attr('stroke', '#0d1a4a')
            .attr('stroke-width', 1.5);

        function redraw() {
            mapGroup.selectAll('path.country').attr('d', pathGen);
            // Skip fill for hovered country and any currently fading in
            mapGroup.selectAll('path.country')
                .filter(d => +d.id !== hoveredCountryId && !revealingIds.has(+d.id))
                .attr('fill', d => countryFill(+d.id));
            mapGroup.select('path.borders').attr('d', pathGen);
            updateDots();
        }


        const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

        // Intro reveal tuning:
        const INTRO_SPEED            = 0.0275; // degrees/ms — constant spin speed for the whole intro.
        // The densest cluster (currently Europe+Africa, 15 countries) takes ~2.1s of
        // fixed COUNTRY_STEP_MS pacing to fully reveal, no matter the rotation speed.
        // At this INTRO_SPEED that burns ~58° of rotation while it plays out (~90° is
        // roughly the edge of what's still visible) — comfortable for now, but adding
        // several more countries to a tight region eats into that margin, so slow this
        // down further (or reduce COUNTRY_STEP_MS) if that happens.
        const REVEAL_LEAD_DEG = 45;   // when entering a new region, wait until its first country is within this many degrees of center (~90° is the edge of visibility)
        const COUNTRY_STEP_MS = 150;  // constant pacing between every reveal, regardless of region
        const REGION_PAUSE_MS = 200;  // brief pause once every country has revealed, before handing off
        const INTRO_LEAD_IN_DEG = 65; // start this many degrees east of the first country — must exceed REVEAL_LEAD_DEG, otherwise it's already "close enough" and reveals instantly anyway

        const featureById = new Map(countries.features.map(f => [+f.id, f]));
        function countryLon(id) {
            const feature = featureById.get(id);
            if (feature) return d3.geoCentroid(feature)[0];
            const dot = smallDots.find(d => d.id === id);
            return dot ? dot.coords[0] : 0;
        }

        // Hand-ordered reveal path — a route through each region, not just a longitude
        // sort, so it doesn't zigzag (Malta landing between Austria/Czechia; Andorra
        // before France) or backtrack (Americas sweep south to north, entering fresh
        // rather than continuing off wherever Europe ended). Update this list if a new
        // country gets added to a region.
        const ORDERED_IDS = [
            392, 156, 702, 376,                                          // Asia: Japan, China, Singapore, Israel
            348, 40, 203, 276, 442, 756, 380, 336, 470,                  // Europe: Hungary -> Austria -> Czechia -> Germany -> Luxembourg -> Switzerland -> Italy -> Vatican City -> Malta
            250, 20, 724, 620, 504, 372,                                 // Europe/Africa: France -> Andorra -> Spain -> Portugal -> Morocco -> Ireland
            32, 604, 170,                                                // South America: Argentina -> Peru -> Colombia
            591, 340, 84, 136, 214, 92, 850, 44, 484, 124,               // North America: Panama -> Honduras -> Belize -> Cayman Is. -> Dominican Rep. -> British Virgin Is. -> US Virgin Is. -> Bahamas -> Mexico -> Canada
        ];

        const allEntries = ORDERED_IDS.map(id => ({
            id,
            region: regions.find(r => r.countries.has(id)).name,
            lon: countryLon(id),
        }));

        let currentSpinSpeed = INTRO_SPEED; // eased down to the ambient SPEED once the sweep ends

        function revealEntry(entry) {
            globallyRevealedCountries.add(entry.id);
            revealingIds.add(entry.id);
            // Fade the country in rather than snapping it
            mapGroup.selectAll('path.country')
                .filter(d => +d.id === entry.id)
                .transition().duration(400).ease(d3.easeCubicOut)
                .attr('fill', '#90ee60')
                .on('end', () => revealingIds.delete(entry.id));
            updateDots();
        }

        // The one rotation timer for the whole intro, start to finish — speed changes
        // smoothly via currentSpinSpeed, but the timer itself never stops or restarts
        function startIntroSpin() {
            let prevIntroElapsed = 0;
            const timer = d3.timer(function (elapsed) {
                if (!isIntro) { timer.stop(); return; }
                const dt = elapsed - prevIntroElapsed;
                prevIntroElapsed = elapsed;
                if (!isDragging) {
                    rotX += dt * currentSpinSpeed;
                    projection.rotate([rotX, rotY]);
                    redraw();
                }
            });
        }

        // Eases the spin speed down from the fast intro rate to the slow ambient rate,
        // so the handoff to the auto-rotation timer below has no jolt
        function decelerateSpin(duration) {
            return new Promise(resolve => {
                const startSpeed = currentSpinSpeed;
                const t0 = performance.now();
                function tick() {
                    const t = Math.min((performance.now() - t0) / duration, 1);
                    currentSpinSpeed = startSpeed + (SPEED - startSpeed) * d3.easeCubicOut(t);
                    if (t < 1) requestAnimationFrame(tick);
                    else { currentSpinSpeed = SPEED; resolve(); }
                }
                requestAnimationFrame(tick);
            });
        }

        // Smoothly animate back to the default scale after the user stops scrolling
        function startZoomReset() {
            zoomAnimCancelled = false;
            const startScale = projection.scale();
            const startRotY  = rotY;
            const targetRotY = -10;
            if (startScale <= radius && Math.abs(startRotY - targetRotY) < 0.01) return;
            const t0       = performance.now();
            const duration = 800;
            // Use d3.timer so this runs in the same batch as the spin timer each frame
            const resetTimer = d3.timer(function () {
                if (zoomAnimCancelled) { resetTimer.stop(); return; }
                const t = Math.min((performance.now() - t0) / duration, 1);
                const e = d3.easeCubicInOut(t);
                projection.scale(Math.max(radius, startScale + (radius - startScale) * e));
                rotY = startRotY + (targetRotY - startRotY) * e;
                projection.rotate([rotX, rotY]);
                redraw();
                if (t >= 1) resetTimer.stop();
            });
        }

        function scheduleZoomReset() {
            clearTimeout(zoomResetTimeout);
            zoomAnimCancelled = true; // cancel any in-progress reset
            zoomResetTimeout = setTimeout(() => {
                if (!isDragging && !isIntro) startZoomReset();
            }, 3000);
        }

        const revealingIds = new Set();

        // Intro reveal — globe spins continuously at one constant speed. Each country
        // fades in at the fixed COUNTRY_STEP_MS pace after the last, unless it hasn't
        // rotated into view yet — in which case it pauses (still spinning) until it
        // has, so nothing reveals off-screen. For tightly-clustered countries that wait
        // resolves instantly; it only adds real delay across a genuinely large gap.
        async function runIntro() {
            // Start a bit east of the first (easternmost) country, so it visibly spins
            // into view rather than being already dead-center at the very first frame
            rotX = -(allEntries[0].lon + INTRO_LEAD_IN_DEG);
            projection.rotate([rotX, rotY]);
            redraw();

            startIntroSpin();

            for (const entry of allEntries) {
                if (!isIntro) break;

                // Wait until this country has actually rotated into view before
                // revealing it — matters for any large gap (e.g. within Asia, between
                // the East Asia cluster and Israel), not just region changes. For
                // tightly-clustered countries this resolves immediately and doesn't
                // affect the per-country pacing at all.
                while (isIntro && (-rotX) - entry.lon > REVEAL_LEAD_DEG) {
                    await sleep(30);
                }
                if (!isIntro) break;

                revealEntry(entry);
                await sleep(COUNTRY_STEP_MS);
            }

            await sleep(REGION_PAUSE_MS); // brief pause once the sweep finishes, still spinning
            if (isIntro) await decelerateSpin(1000); // ease down to ambient speed before handoff

            // Clean up any partial state left by a cancelled or finished intro
            introActive = false;
            isIntro     = false;
            redraw();
        }

        // Auto-rotation timer — paused during intro and briefly after drag/click
        const SPEED = 0.0275; // ambient auto-rotation speed — matches INTRO_SPEED, one full turn every ~13s
        d3.timer(function (elapsed) {
            const dt = elapsed - prevElapsed;
            prevElapsed = elapsed;
            if (!isIntro && !isDragging && performance.now() > spinPausedUntil && projection.scale() <= radius) {
                rotX += dt * SPEED;
                projection.rotate([rotX, rotY]);
                redraw();
            }
        });

        // Cursor: grab only when hovering inside the globe circle
        svg.on('mousemove.cursor', function (event) {
            const [mx, my] = d3.pointer(event);
            svg.style('cursor', isDragging ? 'grabbing' : (inGlobe(mx, my) ? 'grab' : 'default'));
        });

        // Drag/wheel/pinch interaction — skipped entirely on touch/coarse-pointer
        // devices, so touching the globe there falls through to normal page scroll
        // instead of fighting it. The globe still displays and auto-rotates as usual.
        if (!isMobile) {
            // Drag to rotate — also cancels the intro tour if it's still running
            svg.call(d3.drag()
                .on('start', function (event) {
                    const src = event.sourceEvent;
                    const clientX = src.touches ? src.touches[0].clientX : src.clientX;
                    const clientY = src.touches ? src.touches[0].clientY : src.clientY;
                    const [sx, sy] = toSVGCoords(clientX, clientY);
                    if (!inGlobe(sx, sy)) { dragActive = false; return; }
                    // Don't start drag when two fingers are down (pinch-to-zoom)
                    if (src.touches && src.touches.length >= 2) { dragActive = false; return; }
                    dragActive        = true;
                    const wasIntro    = isIntro;
                    isIntro           = false;
                    isDragging        = true;
                    introActive       = false;
                    zoomAnimCancelled = true;
                    clearTimeout(zoomResetTimeout);
                    if (wasIntro) projection.scale(radius);
                    tooltip.style.display = 'none';
                    svg.style('cursor', 'grabbing');
                    redraw();
                })
                .on('drag', function (event) {
                    const src = event.sourceEvent;
                    if (src && src.touches && src.touches.length >= 2) return; // pinch handled by window capture listener
                    if (!dragActive) return;
                    const dragSensitivity = 0.4 / (projection.scale() / radius);
                    rotX += event.dx * dragSensitivity;
                    rotY = Math.max(-90, Math.min(90, rotY - event.dy * dragSensitivity));
                    projection.rotate([rotX, rotY]);
                    redraw();
                })
                .on('end', function () {
                    dragActive      = false;
                    isDragging      = false;
                    spinPausedUntil = performance.now() + 3000;
                    scheduleZoomReset();
                    svg.style('cursor', 'grab');
                })
            );

            // Mouse-wheel zoom — disabled during intro tour
            svg.node().addEventListener('wheel', function (event) {
                const [lx, ly] = toSVGCoords(event.clientX, event.clientY);
                if (!inGlobe(lx, ly)) return;
                event.preventDefault();
                if (isIntro) return;
                const factor = event.deltaY < 0 ? 1.06 : 1 / 1.06;
                const newScale = Math.max(radius, Math.min(radius * 4, projection.scale() * factor));
                projection.scale(newScale);
                redraw();
                scheduleZoomReset(); // zoom resets 3 seconds after last scroll
            }, { passive: false });

            // Touch: track pinch start distance
            svg.node().addEventListener('touchstart', function (event) {
                if (event.touches.length === 2) {
                    event.preventDefault(); // block browser native pinch-to-zoom
                    const t0 = event.touches[0], t1 = event.touches[1];
                    lastPinchDist = Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
                    dragActive = false; // cancel any drag that started from the first finger
                }
            }, { passive: false });

            // Pinch-to-zoom + prevent page scroll while dragging globe.
            // Must be on window in capture phase — d3 registers its touchmove on document in
            // capture phase and calls stopImmediatePropagation(), so window capture runs first.
            window.addEventListener('touchmove', function (event) {
                if (event.touches.length >= 2 && lastPinchDist !== null) {
                    event.preventDefault();
                    if (!isIntro) {
                        const t0 = event.touches[0], t1 = event.touches[1];
                        const dist = Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
                        const factor = dist / lastPinchDist;
                        lastPinchDist = dist;
                        const newScale = Math.max(radius, Math.min(radius * 4, projection.scale() * factor));
                        projection.scale(newScale);
                        redraw();
                        scheduleZoomReset();
                    }
                } else if (dragActive) {
                    event.preventDefault(); // prevent page scroll while single-finger dragging
                }
            }, { capture: true, passive: false });

            // Touch: reset pinch tracking on finger lift
            svg.node().addEventListener('touchend', function () {
                lastPinchDist = null;
            }, { passive: true });

            // iOS Safari: gesturechange fires for pinch independently of d3's touchmove capture
            let lastGestureScale = 1;
            svg.node().addEventListener('gesturestart', function (event) {
                event.preventDefault();
                lastGestureScale = 1;
                dragActive = false;
            }, { passive: false });
            svg.node().addEventListener('gesturechange', function (event) {
                event.preventDefault();
                if (!isIntro) {
                    const factor = event.scale / lastGestureScale;
                    lastGestureScale = event.scale;
                    const newScale = Math.max(radius, Math.min(radius * 4, projection.scale() * factor));
                    projection.scale(newScale);
                    redraw();
                    scheduleZoomReset();
                }
            }, { passive: false });
            svg.node().addEventListener('gestureend', function (event) {
                event.preventDefault();
                lastGestureScale = 1;
            }, { passive: false });
        }

        runIntro();
    });
    </script>

    <script>
    // Star field — avoids the heading text bounding box
    window.addEventListener('load', function () {
        const field   = document.getElementById('star-field');
        const section = document.querySelector('.dark-section');
        const heading = document.querySelector('.heading-dark');

        const sr  = section.getBoundingClientRect();
        const hr  = heading.getBoundingClientRect();
        const pad = 18;

        const exL = ((hr.left   - pad - sr.left) / sr.width)  * 100;
        const exR = ((hr.right  + pad - sr.left) / sr.width)  * 100;
        const exT = ((hr.top    - pad - sr.top)  / sr.height) * 100;
        const exB = ((hr.bottom + pad - sr.top)  / sr.height) * 100;

        function overlaps(x, y) {
            return x >= exL && x <= exR && y >= exT && y <= exB;
        }

        for (let i = 0; i < 200; i++) {
            let x, y, attempts = 0;
            do {
                x = Math.random() * 100;
                y = Math.random() * 100;
            } while (overlaps(x, y) && ++attempts < 25);

            const s         = document.createElement('div');
            s.className     = 'star';
            s.style.left    = x + '%';
            s.style.top     = y + '%';
            const size      = Math.random() < 0.8 ? 1 : (Math.random() < 0.6 ? 2 : 3);
            s.style.width   = s.style.height = size + 'px';
            s.style.opacity = (0.2 + Math.random() * 0.75).toFixed(2);
            const r = Math.random();
            if      (r < 0.07) s.style.background = '#ffeebb';
            else if (r < 0.14) s.style.background = '#cce0ff';
            field.appendChild(s);
        }
    });
    </script>
</body>
